{% extends "base.html" %}

{% block title %}Logbook Scanner Pro - Login{% endblock %}

{% block head %}
<style>
    /* Prevent sidebar and topbar from showing on login page */
    .sidebar {
        display: none !important;
    }

    .top-bar {
        display: none !important;
    }

    .main-content {
        margin-left: 0 !important;
        max-width: 100% !important;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, var(--bg-dark), #111424);
        padding: 0 !important;
    }

    .content-wrapper {
        padding: 0;
        width: 100%;
        display: flex;
        justify-content: center;
    }

    .auth-container {
        width: 100%;
        max-width: 420px;
        padding: 2rem;
    }

    .auth-card {
        background: rgba(30, 35, 50, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        text-align: center;
    }

    .auth-card h2 {
        font-size: 2rem;
        font-weight: 600;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #fff, #a0a5b5);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
    }

    .auth-subtitle {
        color: var(--text-light);
        margin-bottom: 32px;
        font-size: 0.95rem;
    }

    .form-group {
        text-align: left;
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.85rem;
        color: var(--text-light);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-family: var(--font-mono);
    }

    .input-with-icon {
        position: relative;
    }

    .input-with-icon i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
        font-size: 1.1rem;
    }

    .input-with-icon input {
        width: 100%;
        padding: 12px 16px 12px 42px;
        background: rgba(15, 20, 30, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        color: #fff;
        font-family: var(--font-sans);
        font-size: 1rem;
        transition: all 0.3s ease;
    }

    .input-with-icon input:focus {
        outline: none;
        border-color: var(--primary);
        background: rgba(15, 20, 30, 0.8);
        box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.2);
    }

    .auth-submit {
        width: 100%;
        padding: 14px;
        border-radius: 12px;
        font-size: 1.05rem;
        font-weight: 500;
        margin-top: 12px;
        background: linear-gradient(135deg, var(--primary), #3a0ca3);
        border: none;
        color: white;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .auth-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(67, 97, 238, 0.4);
    }

    .auth-submit:active {
        transform: translateY(0);
    }

    .auth-footer {
        margin-top: 32px;
        font-size: 0.9rem;
        color: var(--text-light);
    }

    .auth-footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s;
    }

    .auth-footer a:hover {
        color: #fff;
    }

    .auth-error {
        background: rgba(231, 76, 60, 0.1);
        border: 1px solid rgba(231, 76, 60, 0.2);
        color: var(--danger);
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 0.9rem;
        text-align: left;
    }

    .spin {
        display: inline-block;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        100% {
            transform: rotate(360deg);
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div style="margin-bottom: 24px;">
            <i class="ri-flight-takeoff-line"
                style="font-size: 3rem; color: var(--primary); display: inline-block; padding: 16px; background: rgba(67, 97, 238, 0.1); border-radius: 50%;"></i>
        </div>
        <h2>Welcome Back</h2>
        <p class="auth-subtitle">Sign in to your digital logbook</p>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-with-icon">
                    <i class="ri-mail-line"></i>
                    <input type="email" id="email" required placeholder="pilot@example.com">
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-icon">
                    <i class="ri-lock-password-line"></i>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
            </div>
            <div id="authError" class="auth-error" style="display: none;"></div>
            <button type="submit" class="btn btn-primary auth-submit">
                <i class="ri-login-circle-line"></i> Login
            </button>
        </form>
        <div class="auth-footer">
            Don't have an account? <a href="/register">Create one</a>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
