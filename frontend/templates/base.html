<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Logbook Scanner Pro{% endblock %}</title>

    <!-- External Libs -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- App Styles -->
    <link rel="stylesheet" href="/static/css/styles.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">

    {% block head %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">

    <div class="app-container">
        <!-- Sidebar -->
        {% include "components/sidebar.html" %}

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <h1 class="page-title">{% block page_title %}Dashboard{% endblock %}</h1>
                <div class="top-bar-actions">
                    <button class="icon-btn" onclick="toggleTheme()" title="Toggle Dark Mode" id="theme-btn">🌙</button>
                    {% block top_actions %}{% endblock %}
                </div>
            </header>

            <div class="content-wrapper">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <!-- Custom Modal Dialogs -->
    <div id="custom-dialog-overlay" class="custom-dialog-overlay" style="display: none;">
        <div class="custom-dialog">
            <div id="custom-dialog-message" class="custom-dialog-message"></div>
            <div class="custom-dialog-actions" id="custom-dialog-actions">
                <button id="custom-dialog-cancel" class="secondary" style="display: none;">Cancel</button>
                <button id="custom-dialog-confirm">OK</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
